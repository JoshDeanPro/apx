[project]
name = "openpower-api"
version = "0.1.0"
description = "OpenPower FastAPI backend — trusted application/API boundary for OpenPower."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "PyJWT[crypto]>=2.9",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "cryptography>=43",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openpower_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
