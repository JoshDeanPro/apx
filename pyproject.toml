[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apx"
version = "0.8.3"
description = "APX: Universal Action Protocol & Capability Fabric"
readme = "README.md"
authors = [
    {name = "JoshDeanPro", email = "115428326+JoshDeanPro@users.noreply.github.com"}
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "platformdirs>=4.0.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
apx = "apx.entry:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["apx*"]

[tool.setuptools.data-files]
"share/apx/spec/0.1" = ["spec/README.md", "spec/protocol.md", "spec/http.md", "spec/conformance.md", "spec/fabric.md", "spec/discovery.md", "spec/grants.md", "spec/adapters.md", "spec/personal-context.md", "spec/optional-commercial-extensions.md"]
"share/apx/spec/0.1/schemas" = [
    "spec/schemas/action-request.schema.json",
    "spec/schemas/action-result.schema.json",
    "spec/schemas/action-receipt.schema.json",
    "spec/schemas/provider-manifest.schema.json",
    "spec/schemas/resource.schema.json",
    "spec/schemas/personalization-extensions.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
apx = [
    "_ui/index.mjs",
    "_ui/package.json",
    "_ui/package-lock.json",
]
