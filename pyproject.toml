[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localcloud"
version = "0.1.0"
description = "Use your computers and services together, locally and through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
localcloud = "localcloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

