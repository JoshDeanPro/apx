[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apx"
version = "0.6.0"
description = "Use your computers and services together, locally and through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "platformdirs==4.11.2",
]

[project.scripts]
apx = "apx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
